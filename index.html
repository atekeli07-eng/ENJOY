<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENJOY CRM</title>

<style>
body {
  margin:0;
  font-family: Arial;
  display:flex;
  background:#f1f5f9;
}

/* SIDEBAR */
.sidebar {
  width:230px;
  background:#1e293b;
  color:white;
  height:100vh;
  padding:20px;
}
.sidebar h2 {margin-bottom:20px;}
.sidebar a {
  display:block;
  padding:10px;
  margin-bottom:5px;
  color:white;
  text-decoration:none;
  border-radius:6px;
}
.sidebar a:hover {background:#334155;}

/* MAIN */
.main {
  flex:1;
  padding:20px;
}

/* TOPBAR */
.topbar {
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

/* CARDS */
.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
}
.card {
  padding:20px;
  border-radius:10px;
  color:white;
}
.blue{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f97316;}
.purple{background:#a855f7;}

/* FORM */
.form input {
  padding:10px;
  margin:5px;
}
button {
  padding:10px;
  background:#22c55e;
  color:white;
  border:none;
  cursor:pointer;
}

/* TABLE */
table {
  width:100%;
  background:white;
  margin-top:20px;
  border-radius:10px;
  overflow:hidden;
}
th, td {
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

/* MOBILE */
@media(max-width:768px){
  .sidebar{display:none;}
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>ENJOY CRM</h2>
  <a href="#">Ana Sayfa</a>
  <a href="#">Müşteriler</a>
  <a href="#">Gelir - Gider</a>
</div>

<div class="main">

<div class="topbar">
  <h2>Dashboard</h2>
</div>

<div class="cards">
  <div class="card blue">Toplam Müşteri: <span id="total">0</span></div>
  <div class="card green">Toplam Borç: <span id="debt">0</span> ₺</div>
  <div class="card orange">Bugün Gelen: 0</div>
  <div class="card purple">Toplam İşlem: <span id="totalTx">0</span></div>
</div>

<br>

<input id="search" placeholder="Müşteri ara..." onkeyup="searchCustomer()">

<div class="form">
  <input id="name" placeholder="Müşteri adı">
  <input id="service" placeholder="İşlem">
  <input id="price" placeholder="Ücret">
  <input id="paid" placeholder="Ödenen">
  <button onclick="addCustomer()">Kaydet</button>
</div>

<table>
  <thead>
    <tr>
      <th>İsim</th>
      <th>İşlem</th>
      <th>Tarih</th>
      <th>Ücret</th>
      <th>Ödenen</th>
      <th>Kalan</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

</div>

<script>
let customers = JSON.parse(localStorage.getItem("customers")) || [];

function addCustomer(){
  const name = document.getElementById("name").value;
  const service = document.getElementById("service").value;
  const price = Number(document.getElementById("price").value);
  const paid = Number(document.getElementById("paid").value);

  if(!name || !service) return alert("Eksik");

  const remaining = price - paid;

  const record = {
    name,
    service,
    price,
    paid,
    remaining,
    date: new Date().toLocaleString()
  };

  customers.push(record);

  localStorage.setItem("customers", JSON.stringify(customers));

  render();
}

function render(data = customers){
  let html = "";
  let totalDebt = 0;

  data.forEach(c=>{
    totalDebt += c.remaining;

    html += `
      <tr>
        <td>${c.name}</td>
        <td>${c.service}</td>
        <td>${c.date}</td>
        <td>${c.price}₺</td>
        <td>${c.paid}₺</td>
        <td>${c.remaining}₺</td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = html;
  document.getElementById("total").innerText = data.length;
  document.getElementById("debt").innerText = totalDebt;
  document.getElementById("totalTx").innerText = data.length;
}

function searchCustomer(){
  const q = document.getElementById("search").value.toLowerCase();

  const filtered = customers.filter(c =>
    c.name.toLowerCase().includes(q)
  );

  render(filtered);
}

render();
</script>

</body>
</html>
