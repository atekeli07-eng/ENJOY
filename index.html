  }
  if(document.readyState === 'complete') start(); else window.addEventListener('load', start);

</script>
<script type="text/plain" id="appsrc">
const { useState, useEffect } = React;


// ============ SUPABASE BAĞLANTISI ============
// Ayarlar tarayıcıda saklanır. Boşsa sistem tek cihazda (localStorage) çalışır.
// Doluysa her cihazdan ortak veritabanı (Supabase) kullanılır.
const SB = {
  get url() { try { return localStorage.getItem("bp_sb_url") || ""; } catch { return ""; } },
  get key() { try { return localStorage.getItem("bp_sb_key") || ""; } catch { return ""; } },
  get on() { return !!(this.url && this.key); },
  set(url, key) { try { localStorage.setItem("bp_sb_url", url.trim().replace(/\/$/, "")); localStorage.setItem("bp_sb_key", key.trim()); } catch (e) {} },
  clear() { try { localStorage.removeItem("bp_sb_url"); localStorage.removeItem("bp_sb_key"); } catch (e) {} },
  headers() { return { "apikey": this.key, "Authorization": "Bearer " + this.key, "Content-Type": "application/json" }; },
};

// shops <-> DB satırı (snake_case) dönüşümü
const shopToRow = (s) => ({ id: s.id, shop_name: s.shopName, owner: s.owner, phone: s.phone, city: s.city || "", district: s.district, about: s.about, pin: s.pin, rating: s.rating, image: s.image, sub: s.sub, sub_until: s.subUntil, trial_until: s.trialUntil, hours: s.hours, off_days: s.offDays || [], staff: s.staff, services: s.services });
const rowToShop = (r) => ({ id: r.id, shopName: r.shop_name, owner: r.owner, phone: r.phone, city: r.city || "", district: r.district, about: r.about, pin: r.pin, rating: r.rating, image: r.image, sub: r.sub, subUntil: Number(r.sub_until) || 0, trialUntil: Number(r.trial_until) || 0, hours: r.hours, offDays: r.off_days || [], staff: r.staff || [], services: r.services || [] });
const apptToRow = (a) => ({ id: a.id, shop_id: a.shopId, staff_name: a.staffName || "", name: a.name, phone: a.phone, service: a.service, date: a.date, time: a.time, place: a.place, addr: a.addr, vip: !!a.vip, status: a.status, note: a.note || "" });
const rowToAppt = (r) => ({ id: r.id, shopId: r.shop_id, staffName: r.staff_name || "", name: r.name, phone: r.phone, service: r.service, date: r.date, time: r.time, place: r.place, addr: r.addr, vip: !!r.vip, status: r.status, note: r.note || "" });

// ============ STORAGE (yerel) ============
const local = {
  get(key, def) { try { const v = localStorage.getItem("bp_" + key); return v != null ? JSON.parse(v) : def; } catch { return def; } },
  set(key, val) { try { localStorage.setItem("bp_" + key, JSON.stringify(val)); } catch (e) { console.error(e); } },
};

// ============ VERİ KATMANI ============
// shops ve appts için get/replace. Supabase açıksa oraya, değilse localStorage'a.
const db = {
  async loadShops() {
    if (SB.on) {
      try {
        const r = await fetch(`${SB.url}/rest/v1/shops?select=*`, { headers: SB.headers() });
        if (r.ok) return (await r.json()).map(rowToShop);
      } catch (e) { console.error("Supabase shops:", e); }
      return null;
    }
    return local.get("shops", null);
  },
  async loadAppts() {
    if (SB.on) {
      try {
        const r = await fetch(`${SB.url}/rest/v1/appointments?select=*`, { headers: SB.headers() });
        if (r.ok) return (await r.json()).map(rowToAppt);
      } catch (e) { console.error("Supabase appts:", e); }
      return [];
    }
    return local.get("appts", []);
  },
  async upsertShop(shop) {
    if (SB.on) {
      try { await fetch(`${SB.url}/rest/v1/shops?on_conflict=id`, { method: "POST", headers: { ...SB.headers(), "Prefer": "resolution=merge-duplicates" }, body: JSON.stringify(shopToRow(shop)) }); }
      catch (e) { console.error(e); }
    }
  },
  async deleteShop(id) {
    if (SB.on) { try { await fetch(`${SB.url}/rest/v1/shops?id=eq.${id}`, { method: "DELETE", headers: SB.headers() }); } catch (e) { console.error(e); } }
  },
  async upsertAppt(appt) {
    if (SB.on) {
      try { await fetch(`${SB.url}/rest/v1/appointments?on_conflict=id`, { method: "POST", headers: { ...SB.headers(), "Prefer": "resolution=merge-duplicates" }, body: JSON.stringify(apptToRow(appt)) }); }
      catch (e) { console.error(e); }
    }
  },
  async deleteAppt(id) {
    if (SB.on) { try { await fetch(`${SB.url}/rest/v1/appointments?id=eq.${id}`, { method: "DELETE", headers: SB.headers() }); } catch (e) { console.error(e); } }
  },
  saveLocalShops(arr) { if (!SB.on) local.set("shops", arr); },
  saveLocalAppts(arr) { if (!SB.on) local.set("appts", arr); },
};

// ============ HELPERS ============
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtMoney = (n) => Number(n).toLocaleString("tr-TR") + " ₺";
const fmtDate = (iso) => {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" });
};
const uid = (p) => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const DAY = 86400000;
const PLATFORM_PIN = "1504"; // Platform sahibi (senin) giriş şifren — değiştirmek için düzenle
// Platform sahibi giriş bilgileri — sen bu numara+şifreyle girince tüm berberleri yönetirsin
const OWNER_PHONE = "0500 000 00 00"; // Senin sabit giriş numaran
const OWNER_PASS = "1504";            // Senin sabit şifren
const normPhone = (p) => (p || "").replace(/\D/g, "");
// Abonelik durumu hesapla: { state: "trial"|"active"|"expired"|"frozen", daysLeft, label }
const subStatus = (shop) => {
  const now = Date.now();
  if (shop.sub === "frozen") return { state: "frozen", daysLeft: 0, label: "Donduruldu" };
  if (shop.sub === "active") {
    const left = Math.ceil((shop.subUntil - now) / DAY);
    if (shop.subUntil && shop.subUntil < now) return { state: "expired", daysLeft: 0, label: "Süresi doldu" };
    return { state: "active", daysLeft: left, label: `Abone · ${left} gün` };
  }
  // trial
  const left = Math.ceil((shop.trialUntil - now) / DAY);
  if (shop.trialUntil && shop.trialUntil < now) return { state: "expired", daysLeft: 0, label: "Deneme bitti" };
  return { state: "trial", daysLeft: left, label: `Deneme · ${left} gün` };
};
const canOperate = (shop) => { const s = subStatus(shop).state; return s === "trial" || s === "active"; };
const CITIES = ["Adana","Adıyaman","Afyonkarahisar","Ağrı","Amasya","Ankara","Antalya","Artvin","Aydın","Balıkesir","Bilecik","Bingöl","Bitlis","Bolu","Burdur","Bursa","Çanakkale","Çankırı","Çorum","Denizli","Diyarbakır","Edirne","Elazığ","Erzincan","Erzurum","Eskişehir","Gaziantep","Giresun","Gümüşhane","Hakkari","Hatay","Isparta","Mersin","İstanbul","İzmir","Kars","Kastamonu","Kayseri","Kırklareli","Kırşehir","Kocaeli","Konya","Kütahya","Malatya","Manisa","Kahramanmaraş","Mardin","Muğla","Muş","Nevşehir","Niğde","Ordu","Rize","Sakarya","Samsun","Siirt","Sinop","Sivas","Tekirdağ","Tokat","Trabzon","Tunceli","Şanlıurfa","Uşak","Van","Yozgat","Zonguldak","Aksaray","Bayburt","Karaman","Kırıkkale","Batman","Şırnak","Bartın","Ardahan","Iğdır","Yalova","Karabük","Kilis","Osmaniye","Düzce"];
const DISTRICTS = CITIES; // geriye dönük uyumluluk
const ANTALYA = ["Ev adresim", "Ofis adresim", "Diğer"];
const TIMES = ["08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30","21:00","21:30","22:00","22:30","23:00"];
const DAYS = [["mon","Pzt"],["tue","Sal"],["wed","Çar"],["thu","Per"],["fri","Cum"],["sat","Cmt"],["sun","Paz"]];
const DAY_KEY = ["sun","mon","tue","wed","thu","fri","sat"]; // JS getDay() sırası
const defaultHours = () => ({
  mon: { open: "08:00", close: "22:00", closed: false },
  tue: { open: "08:00", close: "22:00", closed: false },
  wed: { open: "08:00", close: "22:00", closed: false },
  thu: { open: "08:00", close: "22:00", closed: false },
  fri: { open: "08:00", close: "22:00", closed: false },
  sat: { open: "09:00", close: "22:00", closed: false },
  sun: { open: "10:00", close: "20:00", closed: false },
});
const defaultStaff = (owner) => [{ id: uid("st"), name: owner || "Usta", role: "Berber" }];
// Bir gün için, çalışma saatleri içinde kalan randevu saatlerini döndür
const slotsForDate = (shop, iso) => {
  const hours = shop.hours || defaultHours();
  const offDays = shop.offDays || [];
  if (offDays.includes(iso)) return [];
  const dk = DAY_KEY[new Date(iso + "T00:00:00").getDay()];
  const h = hours[dk];
  if (!h || h.closed) return [];
  let list = TIMES.filter((t) => t >= h.open && t <= h.close);
  if (iso === todayISO()) {
    const now = new Date();
    const cur = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    list = list.filter((t) => t > cur);
  }
  return list;
};
const isClosed = (shop, iso) => {
  const offDays = shop.offDays || [];
  if (offDays.includes(iso)) return true;
  const dk = DAY_KEY[new Date(iso + "T00:00:00").getDay()];
  const h = (shop.hours || defaultHours())[dk];
  return !h || h.closed;
};

const defaultServices = () => [
  { id: uid("sv"), name: "Klasik Traş + Saç Kesimi", dur: 45, price: 1100, desc: "Saç kesimi, sakal düzeltme" },
  { id: uid("sv"), name: "Sakal Şekillendirme + Sıcak Havlu", dur: 45, price: 1350, desc: "Sıcak havlu ritüeli, jiletle bitiş" },
  { id: uid("sv"), name: "Komple Traş + Cilt Bakımı", dur: 60, price: 1800, desc: "Saç, sakal, peeling ve maske" },
];

// ============ SEED ============
const SEED_SHOPS = [
  { id: "shop1", shopName: "Ahmet Tekeli Erkek Kuaförü", owner: "Ahmet Tekeli", phone: "0532 100 15 04", city: "Antalya", district: "Muratpaşa", about: "Antalya'da evde ve ofiste VIP traş hizmeti. Klasik usta işi.", pin: "1504", rating: 4.9, image: "cemo-bg.png",
    sub: "active", subUntil: Date.now() + 24 * 86400000, trialUntil: 0,
    hours: defaultHours(),
    staff: [{ id: "st-a1", name: "Ahmet Tekeli", role: "Usta berber" }, { id: "st-a2", name: "Yusuf", role: "Berber" }],
    services: [
      { id: "a-sv1", name: "Klasik Traş + Saç Kesimi", dur: 45, price: 1100, desc: "Saç kesimi, sakal düzeltme" },
      { id: "a-sv2", name: "Sakal Şekillendirme + Sıcak Havlu", dur: 45, price: 1350, desc: "Sıcak havlu ritüeli, jiletle bitiş" },
      { id: "a-sv3", name: "Komple Traş + Cilt Bakımı", dur: 60, price: 1800, desc: "Saç, sakal, peeling ve maske" },
      { id: "a-sv4", name: "Premium Paket", dur: 90, price: 2400, desc: "Traş, bakım, yüz masajı, styling" },
    ] },
  { id: "shop2", shopName: "Mert Kuaför Lounge", owner: "Mert Yıldız", phone: "0533 200 00 00", city: "Antalya", district: "Konyaaltı", about: "Modern erkek bakımı, cilt ve saç uzmanı.", pin: "0000", rating: 4.7, image: "",
    sub: "trial", subUntil: 0, trialUntil: Date.now() + 5 * 86400000,
    hours: defaultHours(),
    staff: [{ id: "st-b1", name: "Mert Yıldız", role: "Usta berber" }],
    services: [
      { id: "b-sv1", name: "Saç Kesimi", dur: 30, price: 900, desc: "Makas ve makine" },
      { id: "b-sv2", name: "Sakal + Saç", dur: 50, price: 1400, desc: "Komple bakım" },
    ] },
];
const SEED_APPTS = [
  { id: "ap1", shopId: "shop1", name: "Cem Aydın", phone: "0532 111 22 33", service: "a-sv2", date: todayISO(), time: "09:30", place: "home", addr: "Lara, Muratpaşa", vip: true, status: "done", note: "Kısa sakal sever" },
  { id: "ap2", shopId: "shop1", name: "Serkan Doğan", phone: "0533 444 55 66", service: "a-sv3", date: todayISO(), time: "11:00", place: "office", addr: "Konyaaltı, Ofis Kat 6", vip: true, status: "route", note: "" },
  { id: "ap3", shopId: "shop1", name: "Emre Yılmaz", phone: "0535 777 88 99", service: "a-sv1", date: todayISO(), time: "13:30", place: "home", addr: "Lara, Muratpaşa", vip: false, status: "confirmed", note: "" },
  { id: "ap4", shopId: "shop1", name: "Burak Şen", phone: "0536 222 33 44", service: "a-sv4", date: todayISO(), time: "15:00", place: "home", addr: "Belek, Serik", vip: true, status: "pending", note: "Doğum günü 12 Haziran" },
];

// ============ APP ROOT ============
function App() {
  const [shops, setShops] = useState(null);
  const [appts, setAppts] = useState(null);
  const [route, setRoute] = useState({ name: "landing" });
  const [locked, setLocked] = useState(false); // müşteri linkle geldi mi (berber sayfasına kilitli)

  // Açılış yönlendirmesi: önce müşteri linki (#shop), sonra kayıtlı berber oturumu
  useEffect(() => {
    const h = (window.location.hash || "").replace("#", "").trim();
    if (h && h.startsWith("shop")) { setRoute({ name: "customerShop", shopId: h }); setLocked(true); return; }
    try {
      const sess = localStorage.getItem("bp_session"); // giriş yapan berberin id'si
      const owner = localStorage.getItem("bp_owner_session"); // platform sahibi girişi
      if (owner === "1") setRoute({ name: "owner" });
      else if (sess) setRoute({ name: "admin", shopId: sess });
    } catch (e) {}
  }, []);

  // Berber/sahip oturumunu kaydet veya temizle
  const startSession = (shopId) => { try { localStorage.setItem("bp_session", shopId); localStorage.removeItem("bp_owner_session"); } catch (e) {} };
  const startOwnerSession = () => { try { localStorage.setItem("bp_owner_session", "1"); localStorage.removeItem("bp_session"); } catch (e) {} };
  const endSession = () => { try { localStorage.removeItem("bp_session"); localStorage.removeItem("bp_owner_session"); } catch (e) {} };

  useEffect(() => {
    (async () => {
      let s = await db.loadShops();
      if (!s || !s.length) {
        s = SEED_SHOPS;
        if (SB.on) { for (const sh of s) await db.upsertShop(sh); } else { db.saveLocalShops(s); }
      }
      setShops(s);
      let a = await db.loadAppts();
      if ((!a || !a.length) && !SB.on) { a = SEED_APPTS; db.saveLocalAppts(a); }
      setAppts(a || []);
    })();
  }, []);

  // shops dizisini güncelle: state + Supabase diff (upsert değişen, sil eksik olan)
  const saveShops = (next) => {
    const prev = shops || [];
    setShops(next);
    if (SB.on) {
      next.forEach((s) => { const old = prev.find((p) => p.id === s.id); if (!old || JSON.stringify(old) !== JSON.stringify(s)) db.upsertShop(s); });
      prev.forEach((p) => { if (!next.find((s) => s.id === p.id)) db.deleteShop(p.id); });
    } else { db.saveLocalShops(next); }
  };
  const saveAppts = (next) => {
    const prev = appts || [];
    setAppts(next);
    if (SB.on) {
      next.forEach((a) => { const old = prev.find((p) => p.id === a.id); if (!old || JSON.stringify(old) !== JSON.stringify(a)) db.upsertAppt(a); });
      prev.forEach((p) => { if (!next.find((a) => a.id === p.id)) db.deleteAppt(p.id); });
    } else { db.saveLocalAppts(next); }
  };

  if (!shops || !appts) return <div style={S.loading}>Yükleniyor…</div>;

  const go = (r) => setRoute(r);

  return (
    <div style={{ minHeight: "100vh", background: "#f4f3ef" }}>
      <style>{CSS}</style>

      {route.name === "landing" && (
        <Landing onAdmin={() => go({ name: "adminLogin" })} onRegister={() => go({ name: "register" })} />
      )}

      {route.name === "customerShop" && (() => {
        const shop = shops.find((s) => s.id === route.shopId);
        if (!shop) return <NotFound onExit={locked ? null : () => go({ name: "landing" })} text="Berber bulunamadı. Linki kontrol edin." />;
        if (!canOperate(shop)) return <NotFound onExit={locked ? null : () => go({ name: "landing" })} text={`${shop.shopName} şu an randevu almıyor.`} />;
        return (
          <CustomerApp shop={shop} appts={appts} locked={locked}
            addAppt={(a) => saveAppts([...appts, a])} onExit={locked ? null : () => go({ name: "landing" })} />
        );
      })()}

      {route.name === "adminLogin" && (
        <AdminLogin shops={shops} onSuccess={(shopId) => { startSession(shopId); go({ name: "admin", shopId }); }} onBack={() => go({ name: "landing" })} onRegister={() => go({ name: "register" })} onOwner={() => { startOwnerSession(); go({ name: "owner" }); }} />
      )}

      {route.name === "register" && (
        <Register shops={shops} onCreate={(shop) => { saveShops([...shops, shop]); startSession(shop.id); go({ name: "admin", shopId: shop.id }); }} onBack={() => go({ name: "landing" })} />
      )}

      {route.name === "admin" && (() => {
        const shop = shops.find((s) => s.id === route.shopId);
        if (!shop) return null;
        if (!canOperate(shop)) return <Locked shop={shop} onExit={() => { endSession(); go({ name: "landing" }); }} />;
        return (
          <AdminPanel shop={shop} appts={appts}
            saveAppts={saveAppts} saveShops={saveShops} shops={shops}
            onExit={() => { endSession(); go({ name: "landing" }); }} />
        );
      })()}

      {route.name === "ownerLogin" && (
        <OwnerLogin onSuccess={() => { startOwnerSession(); go({ name: "owner" }); }} onBack={() => go({ name: "landing" })} />
      )}

      {route.name === "owner" && (
        <OwnerPanel shops={shops} saveShops={saveShops} onExit={() => { endSession(); go({ name: "landing" }); }} />
      )}
    </div>
  );
}

// ============ LANDING (sadece berber giriş/kayıt) ============
function Landing({ onAdmin, onRegister }) {
  return (
    <div style={S.landing}>
      <div style={{ ...S.landHero, minHeight: "100vh", display: "flex", flexDirection: "column", justifyContent: "center" }}>
        <div style={S.landHeroInner}>
          <div style={S.landTag}>MOBİL BERBER RANDEVU PLATFORMU</div>
          <h1 style={S.landTitle}>Randevular artık <span style={{ color: "#d8bd86" }}>senin elinde</span></h1>
          <p style={S.landSub}>Müşterilerin telefonla aramak yerine senin özel linkinden randevu alsın. Dükkanını oluştur, linkini paylaş, randevuların panelde toplansın.</p>
          <div style={{ ...S.landActions, flexDirection: "column", maxWidth: 320, margin: "0 auto" }}>
            <button style={{ ...S.landBtnGold, width: "100%" }} onClick={onRegister}>Berberim, katılmak istiyorum</button>
            <button style={{ ...S.landBtnGhost, width: "100%" }} onClick={onAdmin}>Berber girişi</button>
          </div>
          <div style={{ marginTop: 28, fontSize: 12, color: "rgba(255,255,255,0.5)", maxWidth: 320, margin: "28px auto 0", lineHeight: 1.6 }}>
            Müşteriler bu sayfayı kullanmaz. Her berber, panelindeki kendine özel randevu linkini müşterilerine gönderir.
          </div>
        </div>
      </div>
    </div>
  );
}

// ============ ADMIN LOGIN (telefon + PIN) ============
function AdminLogin({ shops, onSuccess, onBack, onRegister, onOwner }) {
  const [phone, setPhone] = useState("");
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");

  const submit = () => {
    // Önce platform sahibi mi diye bak
    if (normPhone(phone) === normPhone(OWNER_PHONE)) {
      if (pin === OWNER_PASS) { onOwner(); return; }
      setErr("Şifre hatalı"); return;
    }
    const match = shops.find((s) => normPhone(s.phone) === normPhone(phone));
    if (!match) { setErr("Bu numarayla kayıtlı dükkan bulunamadı"); return; }
    if (match.pin !== pin) { setErr("Şifre hatalı"); return; }
    onSuccess(match.id);
  };

  return (
    <div style={S.authWrap}>
      <div style={{ ...S.authCard, maxWidth: 380 }}>
        <div style={S.authTitle}>Berber Girişi</div>
        <div style={S.authSub}>Telefon numaranız ve şifrenizle giriş yapın</div>

        <Label>Telefon numarası</Label>
        <input style={S.input} value={phone} inputMode="tel" placeholder="0532 …"
          onChange={(e) => { setPhone(e.target.value); setErr(""); }} />

        <Label>Şifre (4 haneli PIN)</Label>
        <input style={S.input} value={pin} maxLength={4} inputMode="numeric" type="password" placeholder="••••"
          onChange={(e) => { setPin(e.target.value.replace(/\D/g, "").slice(0, 4)); setErr(""); }}
          onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />

        {err && <div style={{ color: "#a8443a", fontSize: 13, marginTop: 12, fontWeight: 600 }}>{err}</div>}

        <button style={{ ...S.actBtn, width: "100%", marginTop: 18 }} onClick={submit}>Giriş Yap</button>

        <div style={{ textAlign: "center", marginTop: 18, fontSize: 13, color: "#6b6862" }}>
          Hesabınız yok mu? <span style={{ color: "#b89651", fontWeight: 700, cursor: "pointer" }} onClick={onRegister}>Berber olarak katıl</span>
        </div>
        <div style={S.authBack} onClick={onBack}>← Ana sayfa</div>
      </div>
    </div>
  );
}

// ============ REGISTER (yeni berber katılır) ============
function Register({ onCreate, onBack, shops }) {
  const [f, setF] = useState({ shopName: "", owner: "", phone: "", city: "", district: "", about: "", pin: "" });
  const set = (k, v) => setF({ ...f, [k]: v });
  const [err, setErr] = useState("");
  const norm = (p) => p.replace(/\D/g, "");
  const valid = f.shopName.trim() && f.owner.trim() && norm(f.phone).length >= 10 && f.city && /^\d{4}$/.test(f.pin);
  const submit = () => {
    if (!valid) return;
    if (shops.some((s) => norm(s.phone) === norm(f.phone))) { setErr("Bu telefon numarası zaten kayıtlı"); return; }
    onCreate({ id: uid("shop"), shopName: f.shopName.trim(), owner: f.owner.trim(), phone: f.phone.trim(), city: f.city, district: f.district.trim(),
      about: f.about.trim() || "Mobil berber hizmeti.", pin: f.pin, rating: 5.0, image: "",
      sub: "trial", subUntil: 0, trialUntil: Date.now() + 7 * 86400000,
      hours: defaultHours(), staff: defaultStaff(f.owner.trim()), services: defaultServices() });
  };
  return (
    <div style={S.authWrap}>
      <div style={{ ...S.authCard, maxWidth: 440 }}>
        <div style={S.authTitle}>Berber Olarak Katıl</div>
        <div style={S.authSub}>Dükkanını oluştur, hemen randevu almaya başla</div>
        <Label>Dükkan adı</Label>
        <input style={S.input} value={f.shopName} onChange={(e) => { set("shopName", e.target.value); setErr(""); }} placeholder="Örn. Yıldız Erkek Kuaförü" />
        <Label>Adınız soyadınız</Label>
        <input style={S.input} value={f.owner} onChange={(e) => set("owner", e.target.value)} placeholder="Ad Soyad" />
        <Label>Telefon numarası (giriş için kullanılır)</Label>
        <input style={S.input} value={f.phone} inputMode="tel" onChange={(e) => { set("phone", e.target.value); setErr(""); }} placeholder="0532 …" />
        <Label>Şehir</Label>
        <select style={S.input} value={f.city} onChange={(e) => set("city", e.target.value)}>
          <option value="">Şehir seçin</option>
          {CITIES.map((c) => <option key={c}>{c}</option>)}
        </select>
        <Label>İlçe / Semt</Label>
        <input style={S.input} value={f.district} onChange={(e) => set("district", e.target.value)} placeholder="Örn. merkez ilçe veya semt" />
        <Label>Kısa tanıtım</Label>
        <input style={S.input} value={f.about} onChange={(e) => set("about", e.target.value)} placeholder="Tarzınızı bir cümleyle anlatın" />
        <Label>Giriş şifresi (4 haneli PIN)</Label>
        <input style={S.input} value={f.pin} maxLength={4} inputMode="numeric"
          onChange={(e) => set("pin", e.target.value.replace(/\D/g, "").slice(0,4))} placeholder="••••" />
        {err && <div style={{ color: "#a8443a", fontSize: 13, marginTop: 12, fontWeight: 600 }}>{err}</div>}
        <div style={{ ...S.noteBox, marginTop: 14 }}>🎁 Kayıt sonrası <b>7 gün ücretsiz deneme</b> başlar. Varsayılan hizmetler eklenir; panelden düzenleyebilirsiniz.</div>
        <button style={{ ...S.actBtn, width: "100%", marginTop: 16, opacity: valid ? 1 : 0.4, pointerEvents: valid ? "auto" : "none" }} onClick={submit}>Dükkanı Oluştur</button>
        <div style={S.authBack} onClick={onBack}>← Ana sayfa</div>
      </div>
    </div>
  );
}

function CustomerBooking({ shop, svc, appts, onBack, onSave }) {
  const [step, setStep] = useState(1);
  const staff = shop.staff || [];
  const [f, setF] = useState({ staffId: staff.length === 1 ? staff[0].id : "", name: "", phone: "", service: "", date: todayISO(), time: "", place: "home", addr: "", note: "" });
  const set = (k, v) => setF({ ...f, [k]: v });
  const slots = slotsForDate(shop, f.date);
  const closed = isClosed(shop, f.date);
  const staffName = (id) => (staff.find((s) => s.id === id) || {}).name || "";
  // Seçili çalışan + tarih için dolu saatler (iptal hariç tüm randevular o saati kapatır)
  const takenTimes = (appts || []).filter((a) => a.shopId === shop.id && a.date === f.date && a.staffName === staffName(f.staffId)).map((a) => a.time);
  const isTaken = (t) => takenTimes.includes(t);
  const canNext = step === 1 ? f.staffId : step === 2 ? f.service : step === 3 ? (f.date && f.time && !closed && !isTaken(f.time)) : (f.name && f.phone);
  const submit = () => onSave({ ...f, id: uid("ap"), shopId: shop.id, staffName: staffName(f.staffId), vip: false, status: "pending" });

  return (
    <>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
        <div style={S.backDot} onClick={step === 1 ? onBack : () => setStep(step - 1)}>←</div>
        <div style={{ fontFamily: "Fraunces, serif", fontSize: 24 }}>Randevu Oluştur</div>
      </div>
      <div style={S.steps}>
        {["Çalışan","Hizmet","Zaman","Bilgiler"].map((s, i) => (
          <div key={s} style={{ ...S.stepDot, fontSize: 10, ...(step >= i+1 ? S.stepActive : {}) }}>{i+1}. {s}</div>
        ))}
      </div>
      <div style={{ minHeight: 220, marginTop: 4 }}>
        {step === 1 && <>
          <Label>Hangi çalışandan randevu almak istersiniz?</Label>
          {staff.map((s) => (
            <div key={s.id} style={{ ...S.svcPick, ...(f.staffId === s.id ? S.svcPickActive : {}) }} onClick={() => set("staffId", s.id)}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ width: 40, height: 40, borderRadius: "50%", background: "#211c16", color: "#b89651", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700 }}>{s.name[0]}</div>
                <div><div style={{ fontWeight: 700 }}>{s.name}</div><div style={{ fontSize: 12, color: "#6b6862" }}>{s.role}</div></div>
              </div>
              {f.staffId === s.id && <span style={{ color: "#b89651", fontWeight: 700 }}>✓</span>}
            </div>
          ))}
        </>}
        {step === 2 && shop.services.map((s) => (
          <div key={s.id} style={{ ...S.svcPick, ...(f.service === s.id ? S.svcPickActive : {}) }} onClick={() => set("service", s.id)}>
            <div><div style={{ fontWeight: 700 }}>{s.name}</div>
              <div style={{ fontSize: 12, color: "#6b6862" }}>{s.desc} · {s.dur} dk</div></div>
            <div style={{ fontFamily: "Fraunces, serif", fontSize: 18, color: "#b89651" }}>{fmtMoney(s.price)}</div>
          </div>
        ))}
        {step === 3 && <>
          <Label>Tarih</Label>
          <input type="date" value={f.date} min={todayISO()} onChange={(e) => setF({ ...f, date: e.target.value || f.date, time: "" })} style={S.input} />
          <Label>Saat</Label>
          {closed ? (
            <div style={{ ...S.noteBox, color: "#a8443a", borderColor: "#f0d9d5" }}>Bu gün kapalı. Lütfen başka bir gün seçin.</div>
          ) : slots.length === 0 ? (
            <div style={{ ...S.noteBox }}>Bu gün için uygun saat yok.</div>
          ) : (
            <>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {slots.map((t) => {
                  const taken = isTaken(t);
                  return (
                    <div key={t}
                      style={{ ...S.timePick,
                        ...(taken ? { background: "#f0eeea", color: "#bdb9b1", textDecoration: "line-through", cursor: "not-allowed", borderColor: "#eceae4" } : {}),
                        ...(f.time === t && !taken ? S.svcPickActive : {}) }}
                      onClick={() => { if (!taken) set("time", t); }}>{t}</div>
                  );
                })}
              </div>
              <div style={{ display: "flex", gap: 16, marginTop: 10, fontSize: 11, color: "#6b6862" }}>
                <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 12, height: 12, borderRadius: 3, border: "1px solid #e4e2db", display: "inline-block" }} /> Boş</span>
                <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 12, height: 12, borderRadius: 3, background: "#f0eeea", display: "inline-block" }} /> Dolu</span>
              </div>
            </>
          )}
          <Label>Konum</Label>
          <div style={{ display: "flex", gap: 8 }}>
            {[["home","🏠 Evim"],["office","🏢 Ofisim"]].map(([k,l]) => (
              <div key={k} style={{ ...S.timePick, flex: 1, textAlign: "center", ...(f.place === k ? S.svcPickActive : {}) }} onClick={() => set("place", k)}>{l}</div>
            ))}
          </div>
          <Label>Adres</Label>
          <input value={f.addr} onChange={(e) => set("addr", e.target.value)} style={S.input} placeholder="Mahalle, sokak, bina/daire no" />
        </>}
        {step === 4 && <>
          <Label>Ad Soyad</Label>
          <input value={f.name} onChange={(e) => set("name", e.target.value)} placeholder="Adınız soyadınız" style={S.input} />
          <Label>Telefon</Label>
          <input value={f.phone} onChange={(e) => set("phone", e.target.value)} placeholder="0532 …" style={S.input} />
          <Label>Adres detayı / not (opsiyonel)</Label>
          <input value={f.note} onChange={(e) => set("note", e.target.value)} placeholder="Kapı no, kat, tercih…" style={S.input} />
          {f.service && <div style={{ ...S.noteBox, marginTop: 16 }}>
            Özet: <b>{staffName(f.staffId)}</b> · <b>{svc(f.service).name}</b><br/>{fmtDate(f.date)} {f.time} · {f.place === "home" ? "Ev" : "Ofis"}, {f.addr}
            <div style={{ marginTop: 4 }}>Tutar: <b>{fmtMoney(svc(f.service).price)}</b></div>
          </div>}
        </>}
      </div>
      <button style={{ ...S.actBtn, width: "100%", marginTop: 12, opacity: canNext ? 1 : 0.4, pointerEvents: canNext ? "auto" : "none" }}
        onClick={() => step < 4 ? setStep(step+1) : submit()}>{step < 4 ? "Devam Et" : "Randevuyu Gönder"}</button>
    </>
  );
}

function CalendarView({ appts }) {
  const [offset, setOffset] = useState(0);
  const base = new Date(); base.setDate(base.getDate() + offset*7);
  const monday = new Date(base); monday.setDate(base.getDate() - ((base.getDay()+6)%7));
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate()+i); return d.toISOString().slice(0,10); });
  return (
    <div className="content" style={{ ...S.content, paddingTop: 32 }}>
      <div style={S.topbarFull}>
        <div style={S.pageTitle}>Takvim</div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <button style={S.smallBtn} onClick={() => setOffset(offset-1)}>‹</button>
          <span style={{ fontSize: 13, fontWeight: 600, minWidth: 110, textAlign: "center" }}>{offset===0?"Bu hafta":offset===1?"Gelecek hafta":offset===-1?"Geçen hafta":`${offset>0?"+":""}${offset} hafta`}</span>
          <button style={S.smallBtn} onClick={() => setOffset(offset+1)}>›</button>
        </div>
      </div>
      <div className="weekGrid" style={S.weekGrid}>
        {days.map((d) => {
          const da = appts.filter((a) => a.date === d).sort((x,y) => x.time.localeCompare(y.time));
          const dd = new Date(d+"T00:00:00"); const isT = d === todayISO();
          return (
            <div key={d} style={{ ...S.dayCol, ...(isT ? { borderColor: "#b89651", borderWidth: 2 } : {}) }}>
              <div style={S.dayHead}><div style={{ fontSize: 11, color: "#6b6862", textTransform: "uppercase" }}>{dd.toLocaleDateString("tr-TR",{weekday:"short"})}</div>
                <div style={{ fontFamily: "Fraunces, serif", fontSize: 22, color: isT ? "#b89651" : "#211c16" }}>{dd.getDate()}</div></div>
              {da.length === 0 && <div style={{ fontSize: 11, color: "#c4c1ba", textAlign: "center", padding: "8px 0" }}>—</div>}
              {da.map((a) => <div key={a.id} style={{ ...S.calChip, borderLeftColor: a.vip ? "#b89651" : "#c4c1ba" }}>
                <div style={{ fontWeight: 700, fontSize: 12 }}>{a.time}</div>
                <div style={{ fontSize: 11, color: "#6b6862", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.name}</div></div>)}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Customers({ appts, svc }) {
  const map = {};
  appts.forEach((a) => {
    if (!map[a.name]) map[a.name] = { name: a.name, phone: a.phone, vip: a.vip, visits: 0, spent: 0, note: a.note, last: a.date };
    map[a.name].visits++; map[a.name].spent += svc(a.service).price;
    if (a.date > map[a.name].last) map[a.name].last = a.date;
    if (a.note) map[a.name].note = a.note;
  });
  const list = Object.values(map).sort((a,b) => b.spent - a.spent);
  return (
    <div className="content" style={{ ...S.content, paddingTop: 32 }}>

function Hours({ shop, updateShop }) {
  const hours = shop.hours || defaultHours();
  const [h, setH] = useState(hours);
  const [saved, setSaved] = useState(false);
  const setDay = (day, patch) => setH({ ...h, [day]: { ...h[day], ...patch } });
  const commit = () => { updateShop({ hours: h }); setSaved(true); setTimeout(() => setSaved(false), 1600); };
  const opts = ["07:00","07:30","08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30","21:00","21:30","22:00","22:30","23:00","23:30","00:00"];

  // İzin / kapalı günler (belirli tarihler)
  const offDays = shop.offDays || [];
  const [newOff, setNewOff] = useState(todayISO());
  const addOff = () => { if (newOff && !offDays.includes(newOff)) updateShop({ offDays: [...offDays, newOff].sort() }); };
  const removeOff = (d) => updateShop({ offDays: offDays.filter((x) => x !== d) });
  const closeToday = () => { const t = todayISO(); if (!offDays.includes(t)) updateShop({ offDays: [...offDays, t].sort() }); };
  const todayOff = offDays.includes(todayISO());

  return (
    <div className="content" style={{ ...S.content, paddingTop: 32, maxWidth: 620 }}>
      <div style={S.pageTitle}>Çalışma Saatleri</div>
      <div style={{ fontSize: 13, color: "#6b6862", marginTop: 6, marginBottom: 18 }}>Müşteriye randevu saatleri bu aralığa göre gösterilir. Kapalı gün ve izin günlerinde randevu alınamaz.</div>

      {/* Hızlı kapatma */}
      <div style={{ ...S.panel, background: todayOff ? "#f7e4e1" : "#211c16", color: todayOff ? "#a8443a" : "#fff", border: "none" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 15 }}>{todayOff ? "🔴 Bugün kapalısınız" : "Kendine vakit mi lazım?"}</div>
            <div style={{ fontSize: 12, opacity: 0.85, marginTop: 2 }}>{todayOff ? "Bugün için yeni randevu alınamıyor." : "Tek dokunuşla bugünü randevuya kapat."}</div>
          </div>
          {todayOff ? (
            <button style={{ ...S.actBtnGhost, background: "#fff" }} onClick={() => removeOff(todayISO())}>Bugünü Aç</button>
          ) : (
            <button style={{ ...S.actBtn }} onClick={closeToday}>Bugünü Kapat</button>
          )}
        </div>
      </div>

      {/* İzin / tatil günleri */}
      <div style={S.panel}>
        <div style={{ fontWeight: 700, marginBottom: 4 }}>İzin / Tatil Günleri</div>
        <div style={{ fontSize: 12, color: "#6b6862", marginBottom: 12 }}>Belirli bir günü kapatmak için tarih seçip ekleyin (izin, tatil, kişisel zaman).</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <input type="date" min={todayISO()} value={newOff} onChange={(e) => setNewOff(e.target.value)} style={{ ...S.input, flex: 1 }} />
          <button style={S.actBtn} onClick={addOff}>Ekle</button>
        </div>
        {offDays.length === 0 && <div style={{ fontSize: 13, color: "#6b6862" }}>Henüz izin günü yok.</div>}
        {offDays.filter((d) => d >= todayISO()).map((d) => (
          <div key={d} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid #e4e2db" }}>
            <span style={{ fontSize: 14 }}>📅 {fmtDate(d)}</span>
            <button style={{ ...S.actBtnGhost, color: "#a8443a" }} onClick={() => removeOff(d)}>Kaldır</button>
          </div>
        ))}
      </div>

      <div style={S.panel}>
        <div style={{ fontWeight: 700, marginBottom: 8 }}>Haftalık Düzen</div>
        {DAYS.map(([key, label]) => (
          <div key={key} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: "1px solid #e4e2db", flexWrap: "wrap" }}>
            <div style={{ width: 50, fontWeight: 700, fontSize: 14 }}>{label}</div>
            {h[key].closed ? (
              <div style={{ flex: 1, color: "#a8443a", fontSize: 13, fontWeight: 600 }}>Kapalı</div>
            ) : (
              <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 8 }}>
                <select style={{ ...S.input, width: "auto", padding: "8px 10px" }} value={h[key].open} onChange={(e) => setDay(key, { open: e.target.value })}>
                  {opts.map((o) => <option key={o}>{o}</option>)}
                </select>
                <span style={{ color: "#6b6862" }}>–</span>
                <select style={{ ...S.input, width: "auto", padding: "8px 10px" }} value={h[key].close} onChange={(e) => setDay(key, { close: e.target.value })}>
                  {opts.map((o) => <option key={o}>{o}</option>)}
                </select>
              </div>
            )}
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#6b6862", cursor: "pointer" }}>
              <input type="checkbox" checked={h[key].closed} onChange={(e) => setDay(key, { closed: e.target.checked })} /> Kapalı
            </label>
          </div>
        ))}
        <button style={{ ...S.actBtn, width: "100%", marginTop: 16 }} onClick={commit}>{saved ? "✓ Kaydedildi" : "Saatleri Kaydet"}</button>
      </div>
    </div>
  );
}

function Services({ shop, updateShop }) {
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({ name: "", desc: "", dur: 45, price: 0 });
  const list = shop.services;
  const startEdit = (s) => { setEditing(s.id); setDraft({ name: s.name, desc: s.desc, dur: s.dur, price: s.price }); };
  const startNew = () => { setEditing("new"); setDraft({ name: "", desc: "", dur: 45, price: 0 }); };
  const commit = () => {
    if (!draft.name.trim()) return;
    const clean = { name: draft.name.trim(), desc: draft.desc.trim(), dur: Number(draft.dur)||0, price: Number(draft.price)||0 };
    const next = editing === "new" ? [...list, { id: uid("sv"), ...clean }] : list.map((s) => s.id === editing ? { ...s, ...clean } : s);
    updateShop({ services: next }); setEditing(null);
  };
  const remove = (id) => { updateShop({ services: list.filter((s) => s.id !== id) }); setEditing(null); };
  return (
    <div className="content" style={{ ...S.content, paddingTop: 32 }}>
      <div style={S.pageTitle}>Hizmetler & Fiyatlar</div>
      <button style={S.addServiceBtn} onClick={startNew}>+ Yeni Hizmet Ekle</button>
      <div style={{ marginTop: 6, display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(300px,1fr))", gap: 16 }}>
        {list.map((s) => (
          <div key={s.id} style={S.svcCard}>
            {editing === s.id ? <SvcForm draft={draft} setDraft={setDraft} onCommit={commit} onCancel={() => setEditing(null)} onDelete={() => remove(s.id)} canDelete={list.length > 1} /> : <>
              <div style={{ fontWeight: 700, fontSize: 16 }}>{s.name}</div>
              <div style={{ fontSize: 13, color: "#6b6862", marginTop: 4 }}>{s.desc}</div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginTop: 16 }}>
                <span style={{ fontSize: 12, color: "#6b6862" }}>⏱ {s.dur} dk</span>
                <span style={{ fontFamily: "Fraunces, serif", fontSize: 24, color: "#b89651" }}>{fmtMoney(s.price)}</span></div>
              <button style={{ ...S.actBtnGhost, width: "100%", marginTop: 14 }} onClick={() => startEdit(s)}>Düzenle</button>
            </>}
          </div>
        ))}
        {editing === "new" && <div style={{ ...S.svcCard, borderColor: "#b89651", borderWidth: 2 }}>
          <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 4 }}>Yeni Hizmet</div>
          <SvcForm draft={draft} setDraft={setDraft} onCommit={commit} onCancel={() => setEditing(null)} /></div>}
      </div>
    </div>
  );
}

}

function Revenue({ appts, svc }) {
  const done = appts.filter((a) => a.status === "done");
  const total = done.reduce((s, a) => s + svc(a.service).price, 0);
  const by = {}; done.forEach((a) => { const n = svc(a.service).name; by[n] = (by[n]||0) + svc(a.service).price; });
  const max = Math.max(...Object.values(by), 1);
  return (
    <div className="content" style={{ ...S.content, paddingTop: 32 }}>
      <div style={S.pageTitle}>Gelir</div>
      <div className="stats" style={{ ...S.stats, marginTop: 20 }}>
        <Stat label="Toplam Gelir" value={fmtMoney(total)} trend="tamamlanan" up />
        <Stat label="Tamamlanan İş" value={done.length} trend="adet" />
        <Stat label="Ortalama Fiş" value={fmtMoney(done.length ? Math.round(total/done.length) : 0)} trend="iş başı" />
        <Stat label="VIP Oranı" value={`%${done.length ? Math.round(done.filter(a=>a.vip).length/done.length*100) : 0}`} trend="müşteri" />
      </div>
      <div style={{ ...S.panel, marginTop: 8 }}>
        <div style={{ fontWeight: 700, marginBottom: 16 }}>Hizmete göre dağılım</div>
        {Object.entries(by).length === 0 && <div style={{ fontSize: 13, color: "#6b6862" }}>Henüz tamamlanan iş yok</div>}
        {Object.entries(by).map(([n, v]) => (
          <div key={n} style={{ marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}><span>{n}</span><span style={{ fontWeight: 600 }}>{fmtMoney(v)}</span></div>
            <div style={{ height: 8, background: "#eee", borderRadius: 4 }}><div style={{ width: `${v/max*100}%`, height: "100%", background: "#b89651", borderRadius: 4 }} /></div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ShopSettings({ shop, updateShop }) {
  const [f, setF] = useState({ shopName: shop.shopName, owner: shop.owner, phone: shop.phone || "", city: shop.city || "", district: shop.district, about: shop.about, pin: shop.pin, image: shop.image });
  const set = (k, v) => setF({ ...f, [k]: v });
  const [saved, setSaved] = useState(false);
  const commit = () => { updateShop({ ...f, pin: /^\d{4}$/.test(f.pin) ? f.pin : shop.pin }); setSaved(true); setTimeout(() => setSaved(false), 1800); };
  const link = `${window.location.origin}${window.location.pathname}#${shop.id}`;
  const [copied, setCopied] = useState(false);
  const copy = () => { try { navigator.clipboard.writeText(link); } catch (e) {} setCopied(true); setTimeout(() => setCopied(false), 1600); };
  const share = () => { const msg = `${shop.shopName} - Online randevu için: ${link}`; window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank"); };

  // Logo yükle: resmi küçült + base64'e çevir
  const onImage = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const max = 800;
        let { width, height } = img;
        if (width > max) { height = height * max / width; width = max; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        set("image", canvas.toDataURL("image/jpeg", 0.8));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  return (
    <div className="content" style={{ ...S.content, paddingTop: 32, maxWidth: 560 }}>
      <div style={S.pageTitle}>Dükkan Ayarları</div>

      <div style={{ ...S.panel, marginTop: 16, background: "#211c16", color: "#fff", border: "none" }}>
        <div style={{ fontWeight: 700, fontSize: 15 }}>📲 Müşteri randevu linkin</div>
        <div style={{ fontSize: 12, color: "#b5b2aa", marginTop: 4, marginBottom: 12 }}>Bu linki müşterilerine gönder. Tıklayınca doğrudan senin randevu sayfan açılır.</div>
        <div style={{ background: "#fff", color: "#211c16", borderRadius: 8, padding: "10px 12px", fontSize: 12, wordBreak: "break-all", marginBottom: 10 }}>{link}</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button style={{ ...S.actBtn, flex: 1 }} onClick={copy}>{copied ? "✓ Kopyalandı" : "Linki Kopyala"}</button>
          <button style={{ ...S.actBtnGhost, flex: 1 }} onClick={share}>WhatsApp'tan Paylaş</button>
        </div>
      </div>

      <div style={{ ...S.panel, marginTop: 0 }}>
        <Label>Logo / Tanıtım Görseli</Label>
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginTop: 6 }}>
          <div style={{ width: 72, height: 72, borderRadius: 12, overflow: "hidden", flexShrink: 0, background: "#211c16", display: "flex", alignItems: "center", justifyContent: "center" }}>
            {f.image ? <img src={f.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ color: "#b89651", fontFamily: "Fraunces, serif", fontSize: 28 }}>{(f.shopName || "?")[0]}</span>}
          </div>
          <div style={{ flex: 1 }}>
            <label style={{ ...S.actBtnGhost, display: "inline-block", cursor: "pointer" }}>
              Görsel Seç
              <input type="file" accept="image/*" onChange={onImage} style={{ display: "none" }} />
            </label>
            {f.image && <button style={{ ...S.actBtnGhost, marginLeft: 8, color: "#a8443a" }} onClick={() => set("image", "")}>Kaldır</button>}
            <div style={{ fontSize: 11, color: "#6b6862", marginTop: 6 }}>Müşteriler bu görselle karşılanır. Telefondan foto seçebilirsin.</div>
          </div>
        </div>
      </div>

      <div style={{ marginTop: 0 }}>
        <Label>Dükkan adı</Label><input style={S.input} value={f.shopName} onChange={(e) => set("shopName", e.target.value)} />
        <Label>Sahip adı</Label><input style={S.input} value={f.owner} onChange={(e) => set("owner", e.target.value)} />
        <Label>Telefon (giriş numarası)</Label><input style={S.input} value={f.phone} inputMode="tel" onChange={(e) => set("phone", e.target.value)} />
        <Label>Şehir</Label>
        <select style={S.input} value={f.city} onChange={(e) => set("city", e.target.value)}>
          <option value="">Şehir seçin</option>
          {CITIES.map((c) => <option key={c}>{c}</option>)}
        </select>
        <Label>İlçe / Semt</Label><input style={S.input} value={f.district} onChange={(e) => set("district", e.target.value)} placeholder="Örn. merkez ilçe veya semt" />
        <Label>Tanıtım</Label><input style={S.input} value={f.about} onChange={(e) => set("about", e.target.value)} />
        <Label>Giriş şifresi (4 hane)</Label><input style={S.input} value={f.pin} maxLength={4} onChange={(e) => set("pin", e.target.value.replace(/\D/g,"").slice(0,4))} />
        <button style={{ ...S.actBtn, width: "100%", marginTop: 16 }} onClick={commit}>{saved ? "✓ Kaydedildi" : "Kaydet"}</button>
      </div>
    </div>
  );
}

function BookingModal({ shop, svc, appts, onClose, onSave }) {
  const [step, setStep] = useState(1);
  const staff = shop.staff || [];
  const [f, setF] = useState({ staffId: staff[0]?.id || "", name: "", phone: "", service: "", date: todayISO(), time: "", place: "home", addr: "", vip: false, note: "" });
  const set = (k, v) => setF({ ...f, [k]: v });
  const canNext = step === 1 ? f.service : step === 2 ? f.date && f.time : f.name && f.phone;
  const staffName = (id) => (staff.find((s) => s.id === id) || {}).name || "";
  // O gün o saatte dolu olan randevular (seçili çalışan; berber 3. adımda çalışanı seçer, o yüzden burada tüm dükkan için gösterip işaret koyuyoruz)
  const dayTaken = (appts || []).filter((a) => a.shopId === shop.id && a.date === f.date).map((a) => a.time);
  const submit = () => onSave({ ...f, id: uid("ap"), shopId: shop.id, staffName: staffName(f.staffId), status: "pending" });
  const baseSlots = slotsForDate(shop, f.date).length ? slotsForDate(shop, f.date) : TIMES.filter((t) => f.date !== todayISO() || t > (String(new Date().getHours()).padStart(2,"0")+":"+String(new Date().getMinutes()).padStart(2,"0")));
  return (
    <div style={S.modalBg} onClick={onClose}>
      <div style={S.modal} onClick={(e) => e.stopPropagation()}>
        <div style={S.modalHead}><div style={{ fontFamily: "Fraunces, serif", fontSize: 22 }}>Yeni Randevu</div><button style={S.closeBtn} onClick={onClose}>✕</button></div>
        <div style={S.steps}>{["Hizmet","Zaman & Yer","Müşteri"].map((s,i) => <div key={s} style={{ ...S.stepDot, ...(step >= i+1 ? S.stepActive : {}) }}>{i+1}. {s}</div>)}</div>
        <div style={{ padding: "8px 4px", minHeight: 240 }}>
          {step === 1 && shop.services.map((s) => (
            <div key={s.id} style={{ ...S.svcPick, ...(f.service === s.id ? S.svcPickActive : {}) }} onClick={() => set("service", s.id)}>
              <div><div style={{ fontWeight: 700 }}>{s.name}</div><div style={{ fontSize: 12, color: "#6b6862" }}>{s.desc} · {s.dur} dk</div></div>
              <div style={{ fontFamily: "Fraunces, serif", fontSize: 18, color: "#b89651" }}>{fmtMoney(s.price)}</div>
            </div>
          ))}
          {step === 2 && <>
            <Label>Tarih</Label><input type="date" value={f.date} min={todayISO()} onChange={(e) => setF({ ...f, date: e.target.value || f.date, time: "" })} style={S.input} />
            <Label>Saat</Label><div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{baseSlots.map((t) => { const taken = dayTaken.includes(t); return <div key={t} style={{ ...S.timePick, ...(taken ? { background: "#f0eeea", color: "#bdb9b1" } : {}), ...(f.time === t ? S.svcPickActive : {}) }} onClick={() => set("time", t)}>{t}{taken ? " •" : ""}</div>; })}</div>
            <div style={{ fontSize: 11, color: "#6b6862", marginTop: 6 }}>• işaretli saatlerde o gün başka randevu var.</div>
            <Label>Konum</Label><div style={{ display: "flex", gap: 8 }}>{[["home","🏠 Ev"],["office","🏢 Ofis"]].map(([k,l]) => <div key={k} style={{ ...S.timePick, flex: 1, textAlign: "center", ...(f.place === k ? S.svcPickActive : {}) }} onClick={() => set("place", k)}>{l}</div>)}</div>
            <Label>Adres</Label><input value={f.addr} onChange={(e) => set("addr", e.target.value)} style={S.input} placeholder="Mahalle, sokak, no" />
          </>}
          {step === 3 && <>
            <Label>Çalışan</Label><select value={f.staffId} onChange={(e) => set("staffId", e.target.value)} style={S.input}>{staff.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}</select>
            <Label>Ad Soyad</Label><input value={f.name} onChange={(e) => set("name", e.target.value)} placeholder="Müşteri adı" style={S.input} />
            <Label>Telefon</Label><input value={f.phone} onChange={(e) => set("phone", e.target.value)} placeholder="0532 …" style={S.input} />
            <Label>Not</Label><input value={f.note} onChange={(e) => set("note", e.target.value)} placeholder="Tercih, kesim notu…" style={S.input} />
            <label style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 14, fontSize: 14, cursor: "pointer" }}>
              <input type="checkbox" checked={f.vip} onChange={(e) => set("vip", e.target.checked)} /> VIP müşteri ★</label>
          </>}
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
          {step > 1 && <button style={S.actBtnGhost} onClick={() => setStep(step-1)}>Geri</button>}
          <button style={{ ...S.actBtn, marginLeft: "auto", opacity: canNext ? 1 : 0.4, pointerEvents: canNext ? "auto" : "none" }}
            onClick={() => step < 3 ? setStep(step+1) : submit()}>{step < 3 ? "İleri" : "Oluştur"}</button>
        </div>
      </div>
    </div>
  );
}

function OwnerLogin({ onSuccess, onBack }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState(false);
  const tryPin = (digit) => {
    if (pin.length >= 4) return;
    const next = pin + digit; setPin(next); setErr(false);
    if (next.length === 4) {
      if (next === PLATFORM_PIN) setTimeout(() => onSuccess(), 150);
      else setTimeout(() => { setErr(true); setPin(""); }, 250);
    }
  };
  return (
    <div style={S.authWrap}>
      <div style={{ ...S.authCard, maxWidth: 340, textAlign: "center" }}>
        <div style={S.authTitle}>Platform Yönetimi</div>
        <div style={S.authSub}>Yönetici şifresi</div>
        <div style={{ display: "flex", gap: 12, justifyContent: "center", margin: "18px 0" }}>
          {[0,1,2,3].map((i) => <div key={i} style={{ ...S.pinDot, ...(pin.length > i ? S.pinDotFull : {}), ...(err ? { borderColor: "#a8443a" } : {}) }} />)}
        </div>
        {err && <div style={{ color: "#a8443a", fontSize: 13, marginBottom: 12, fontWeight: 600 }}>Hatalı şifre</div>}
        <div style={S.pinPad}>
          {["1","2","3","4","5","6","7","8","9","","0","⌫"].map((d, i) => (
            <div key={i} className="pinkey" style={{ ...S.pinKeyDark, ...(d === "" ? { visibility: "hidden" } : {}) }}
              onClick={() => { if (d === "⌫") { setPin(pin.slice(0,-1)); setErr(false); } else if (d) tryPin(d); }}>{d}</div>
          ))}
        </div>
        <div style={S.authBack} onClick={onBack}>← Ana sayfa</div>
      </div>
    </div>
  );
}

// ============ OWNER PANEL (abonelik yönetimi) ============
function OwnerPanel({ shops, saveShops, onExit }) {
  const [q, setQ] = useState("");
  const update = (id, patch) => saveShops(shops.map((s) => (s.id === id ? { ...s, ...patch } : s)));
  const activate = (id, months) => {
    const s = shops.find((x) => x.id === id);
    const base = (s.sub === "active" && s.subUntil > Date.now()) ? s.subUntil : Date.now();
    update(id, { sub: "active", subUntil: base + months * 30 * DAY });
  };
  const freeze = (id) => update(id, { sub: "frozen" });
  const removeShop = (id) => { if (confirm("Bu berberi platformdan kaldırmak istediğinize emin misiniz?")) saveShops(shops.filter((s) => s.id !== id)); };

  const list = shops.filter((s) => !q || s.shopName.toLowerCase().includes(q.toLowerCase()) || s.owner.toLowerCase().includes(q.toLowerCase()) || (s.phone||"").includes(q));
  const counts = {
    active: shops.filter((s) => subStatus(s).state === "active").length,
    trial: shops.filter((s) => subStatus(s).state === "trial").length,
    expired: shops.filter((s) => ["expired","frozen"].includes(subStatus(s).state)).length,
  };

  const badge = (st) => {
    const map = { active:["#e6f0ea","#2f6b4f"], trial:["#eae6f0","#5b4a8a"], expired:["#f7e4e1","#a8443a"], frozen:["#eee","#6b6862"] };
    const [bg,col] = map[st.state];
    return <span style={{ ...S.status, background: bg, color: col }}>{st.label}</span>;
  };

  return (
    <div style={{ minHeight: "100vh", fontFamily: "Manrope, sans-serif", color: "#211c16", background: "#f4f3ef" }}>
      <div style={{ background: "#211c16", color: "#fff", padding: "22px 24px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={{ fontFamily: "Fraunces, serif", fontSize: 22 }}>Platform Yönetimi</div>
          <div style={{ fontSize: 12, opacity: 0.7 }}>Abonelikleri yönet</div>
        </div>
        <div style={S.custExit} onClick={onExit}>✕</div>
      </div>

      <div style={{ maxWidth: 900, margin: "0 auto", padding: "24px" }}>
        <DbSettings />
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 14, marginBottom: 22 }}>
          <Stat label="Aktif Abone" value={counts.active} trend="ödeme yapan" up />
          <Stat label="Denemede" value={counts.trial} trend="ücretsiz" />
          <Stat label="Pasif / Süresi Dolan" value={counts.expired} trend="işlem bekliyor" />
        </div>

        <input style={{ ...S.input, marginBottom: 16 }} placeholder="Berber, sahip veya telefon ara…" value={q} onChange={(e) => setQ(e.target.value)} />

        {list.map((s) => {
          const st = subStatus(s);
          return (
            <div key={s.id} style={{ ...S.panel, marginBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 16 }}>{s.shopName} {badge(st)}</div>
                  <div style={{ fontSize: 13, color: "#6b6862", marginTop: 3 }}>{s.owner} · 📞 {s.phone} · 📍 {[s.district, s.city].filter(Boolean).join(", ")}</div>
                  {s.sub === "active" && s.subUntil ? (
                    <div style={{ fontSize: 12, color: "#6b6862", marginTop: 3 }}>Bitiş: {fmtDate(new Date(s.subUntil).toISOString().slice(0,10))}</div>
                  ) : st.state === "trial" ? (
                    <div style={{ fontSize: 12, color: "#6b6862", marginTop: 3 }}>Deneme bitişi: {fmtDate(new Date(s.trialUntil).toISOString().slice(0,10))}</div>
                  ) : null}
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 14, flexWrap: "wrap" }}>
                <button style={S.actBtn} onClick={() => activate(s.id, 1)}>+1 Ay Abonelik</button>
                <button style={S.actBtnGhost} onClick={() => activate(s.id, 3)}>+3 Ay</button>
                {s.sub !== "frozen" ? (
                  <button style={S.actBtnGhost} onClick={() => freeze(s.id)}>Dondur</button>
                ) : (
                  <button style={S.actBtnGhost} onClick={() => activate(s.id, 1)}>Yeniden Aç</button>
                )}
                <button style={{ ...S.actBtnGhost, marginLeft: "auto", color: "#a8443a" }} onClick={() => removeShop(s.id)}>Kaldır</button>
              </div>
            </div>
          );
        })}
        {list.length === 0 && <Empty text="Kayıt bulunamadı" />}

        <div style={{ ...S.noteBox, marginTop: 16 }}>
          💡 "+1 Ay Abonelik" berberin erişimini bugünden (veya mevcut bitişten) itibaren 30 gün uzatır. Ödemeyi aldıktan sonra bu düğmeye basmanız yeterli; berberin paneli anında açılır.
        </div>
      </div>
    </div>
  );
}

const Stat = ({ label, value, trend, up }) => (
